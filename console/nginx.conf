server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /spine/ {
        proxy_pass http://spine:8101/;
    }
    location /glue/ {
        proxy_pass http://glue:8102/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
